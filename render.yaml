services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Service (Docker)
  # -------------------------------------------------------------
  - type: web
    name: beehive-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beehive-db
          property: connectionString
      - key: PORT
        value: 8000

  # -------------------------------------------------------------
  # 2. Next.js Frontend Dashboard (Docker)
  # -------------------------------------------------------------
  - type: web
    name: beehive-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: beehive-backend
          property: host

databases:
  # -------------------------------------------------------------
  # 3. Managed PostgreSQL Database
  # -------------------------------------------------------------
  - name: beehive-db
    plan: free
    region: oregon
    databaseName: beemonitor
    user: beemonitor_user
